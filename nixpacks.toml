# Force Railway/Nixpacks to ONLY use Python provider
# This prevents auto-detection of Dart/Flutter from pubspec.yaml
providers = ["python"]

# Let Nixpacks handle Python setup automatically with its default venv
[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

# Explicitly disable the build phase (prevents Dart compilation)
[phases.build]
cmds = []

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
