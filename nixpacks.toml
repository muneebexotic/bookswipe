# Force Railway/Nixpacks to ONLY use Python provider
# This prevents auto-detection of Dart/Flutter from pubspec.yaml
providers = ["python"]

# Create venv and install dependencies (avoiding PEP 668 externally-managed-environment error)
[phases.install]
cmds = [
    "python -m venv /opt/venv",
    ". /opt/venv/bin/activate && pip install -r requirements.txt"
]

# Explicitly disable the build phase (prevents Dart compilation)
[phases.build]
cmds = []

[start]
cmd = ". /opt/venv/bin/activate && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
